<!DOCTYPE html>
<!-- ============================================================
     index.html — the FEED: one passage per screen.
     The structure is here; the passages are added by js/feed.js
     from data/passages.csv. Styling lives in css/style.css.
     ============================================================ -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Passages</title>
  <meta name="description" content="Passages from great books, one at a time. Read the one that catches you.">

  <!-- Lets people "Add to Home Screen" and open it like an app -->
  <!-- How the link looks when shared (WhatsApp, iMessage, Reddit, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Passages">
  <meta property="og:title" content="Passages">
  <meta property="og:description" content="Discover literature through the writing itself, one passage at a time, then read the whole work for free.">
  <meta property="og:image" content="https://passages-reader.github.io/icons/share.png">
  <meta property="og:url" content="https://passages-reader.github.io/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f5f0e6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">

  <!-- Fonts: EB Garamond for the literature, Inter for the small interface text -->
  <link rel="preload" href="fonts/eb-garamond.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="feed-page">

  <!-- Top bar: name on the left, Saved and Settings on the right -->
  <header class="topbar">
    <a class="wordmark" id="wordmark" href="about.html" title="About this project">Passages<span class="wordmark-dot" aria-hidden="true"></span></a>
    <nav class="topbar-actions">
      <button class="icon-btn" id="open-saved" aria-label="Your reading and saved passages" title="Your reading">
        <svg viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.6 3.5 5v13.5c3.5-.4 6.5 0 8.5 1.5 2-1.5 5-1.9 8.5-1.5V5C17 4.6 14 5 12 6.5zM12 6.5V20"/></svg>
      </button>
      <button class="icon-btn" id="open-settings" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </nav>
  </header>

  <!-- The feed itself. Each passage becomes a full-screen <article class="card"> -->
  <main class="feed" id="feed" aria-live="polite">
    <p class="loading">Opening the books…</p>
  </main>

  <!-- The sliding panel used for "About this work", "Saved" and "Settings" -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <section class="sheet-panel" role="dialog" aria-modal="true">
      <button class="sheet-close icon-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="sheet-content" id="sheet-content"></div>
    </section>
  </div>

  <!-- ============================================================
       The welcome card: shown once, as the first screen of a first visit
       (or second, if someone arrives through a shared passage).
       Edit the words freely; it's plain HTML. "Read the welcome note again"
       in Settings brings it back.
       ============================================================ -->
  <template id="welcome-template">
    <article class="card welcome">
      <div class="card-inner">
        <h1 class="welcome-title">Passages<span class="wordmark-dot" aria-hidden="true"></span></h1>
        <p class="welcome-lede">Discover literature through the writing itself, one passage at a time, and begin reading whenever something catches you.</p>
        <p class="welcome-how">Just tap one to learn about the work and start reading. Save or share the ones you love.</p>
        <button class="btn welcome-go" data-begin>Swipe up to begin <span class="hint-swipe">↑</span></button>
        <p class="welcome-links"><a href="about.html">More about Passages</a><span data-ig-wrap> · <a data-ig target="_blank" rel="noopener"></a></span></p>
      </div>
    </article>
  </template>

  <!-- Small message that pops up briefly ("Link copied", "Saved") -->
  <div class="toast" id="toast" role="status"></div>

  <!-- Scripts, in order: settings → storage → data loading → the feed -->
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/data.js"></script>
  <script src="js/taste.js"></script>
  <script src="js/sitting.js"></script>
  <script src="js/daily.js"></script>
  <script src="js/shareimage.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/elsewhere.js"></script>
  <script src="js/feed.js"></script>
</body>
</html>

<!DOCTYPE html>
<!-- ============================================================
     index.html — the FEED: one passage per screen.
     The structure is here; the passages are added by js/feed.js
     from data/passages.csv. Styling lives in css/style.css.
     ============================================================ -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Passages</title>
  <meta name="description" content="Passages from great books, one at a time. Read the one that catches you.">

  <!-- Lets people "Add to Home Screen" and open it like an app -->
  <!-- How the link looks when shared (WhatsApp, iMessage, Reddit, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Passages">
  <meta property="og:title" content="Passages">
  <meta property="og:description" content="Discover literature through the writing itself, one passage at a time, then read the whole work for free.">
  <meta property="og:image" content="https://passages-reader.github.io/icons/share.png">
  <meta property="og:url" content="https://passages-reader.github.io/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f5f0e6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

  <!-- Fonts: EB Garamond for the literature, Inter for the small interface text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="feed-page">

  <!-- Top bar: name on the left, Saved and Settings on the right -->
  <header class="topbar">
    <a class="wordmark" id="wordmark" href="about.html" title="About this project">Passages</a>
    <nav class="topbar-actions">
      <button class="icon-btn" id="open-saved" aria-label="Your reading and saved passages" title="Your reading">
        <svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-4.2-6 4.2z"/></svg>
      </button>
      <button class="icon-btn" id="open-settings" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </nav>
  </header>

  <!-- The feed itself. Each passage becomes a full-screen <article class="card"> -->
  <main class="feed" id="feed" aria-live="polite">
    <p class="loading">Opening the books…</p>
  </main>

  <!-- The sliding panel used for "About this work", "Saved" and "Settings" -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <section class="sheet-panel" role="dialog" aria-modal="true">
      <button class="sheet-close icon-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="sheet-content" id="sheet-content"></div>
    </section>
  </div>

  <!-- ============================================================
       The welcome card: shown once, as the first screen of a first visit
       (or second, if someone arrives through a shared passage).
       Edit the words freely; it's plain HTML. "Read the welcome note again"
       in Settings brings it back.
       ============================================================ -->
  <template id="welcome-template">
    <article class="card welcome">
      <div class="card-inner">
        <p class="welcome-eyebrow">A note before you start</p>
        <h1 class="welcome-title">Meet the writing first.</h1>

        <p>Passages helps you discover literature through the writing itself, one passage at a time. Each screen holds a few lines from a novel, a story or a poem, chosen to show what the work is really like.</p>

        <p>If one catches you, the whole work is right here, free, from the first page. The aim isn’t to tell you what you ought to read. It’s to help you find something you want to.</p>

        <h2>How it works</h2>
        <ul>
          <li><strong>Swipe up</strong> for the next passage.</li>
          <li><strong>Tap a passage</strong> for a spoiler-free introduction to the work, why that passage was chosen, and roughly how long the work takes to read.</li>
          <li><strong>Start reading</strong> from page one. When you reach the passage that brought you, it’s highlighted.</li>
          <li><strong>Save</strong> passages you love, <strong>share</strong> them with a link, and find the works you’ve started, and the ones you’ve finished, under the bookmark at the top.</li>
        </ul>

        <h2>What it remembers</h2>
        <p>There’s no account. Your saves, your place in each work and your settings stay in this browser, on this device. The feed notices what you open and save, and what caught you if you choose to say, and slowly shows you more of it, while still mixing in the unexpected. You can change that in Settings.</p>

        <h2>An early version</h2>
        <p>Everything here is in the public domain. New works are added regularly, and some things will change along the way. If something works for you, or doesn’t, <a href="#" data-feedback>I’d love to hear about it</a>.</p>

        <p class="welcome-links"><a href="about.html">More about Passages and why it exists</a></p>

        <p class="welcome-go">Swipe up to begin ↓</p>
      </div>
    </article>
  </template>

  <!-- Small message that pops up briefly ("Link copied", "Saved") -->
  <div class="toast" id="toast" role="status"></div>

  <!-- Scripts, in order: settings → storage → data loading → the feed -->
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/data.js"></script>
  <script src="js/taste.js"></script>
  <script src="js/sitting.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/feed.js"></script>
</body>
</html>
